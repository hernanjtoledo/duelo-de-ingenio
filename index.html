<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duelo de Ingenio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: una columna centrada tipo consola de juego. El anfitrión proyecta la pantalla grande; los jugadores contestan con botones grandes desde el celular. Un solo mundo visual (índigo profundo, respuestas en cuatro colores con forma propia). */
:root{
  --bg:#1a1446;
  --bg-2:#271d66;
  --panel:#33298a;
  --line:#4a3fb0;
  --ink:#f7f4ff;
  --muted:#c3bcf0;
  --gold:#ffd23f;
  --on-gold:#2a2000;
  --a0:#e63e63;
  --a1:#2a6fe6;
  --a2:#f2b705;
  --a3:#1e9a49;
  --on-a2:#2a2000;
  --good:#46e08a;
  --bad:#ff6b81;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background-color:var(--bg);
  background-image:radial-gradient(900px 480px at 50% -8%,var(--bg-2),transparent 70%);
  background-repeat:no-repeat;
  color:var(--ink);
  font:500 1rem/1.5 var(--body);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;text-wrap:balance;overflow-wrap:anywhere}
h1{font-size:clamp(2.2rem,8vw,3.8rem);line-height:1.05}
h2{font-size:1.5rem;line-height:1.2}
h3{font-size:1.2rem}
p{margin:0}
.shell{max-width:1040px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:400 1.3rem/1 var(--display);letter-spacing:.02em;color:var(--gold)}
.pill{font-size:.8rem;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--panel);color:var(--muted)}
.pill[data-ok="1"]{color:var(--good)}
.pill[data-ok="0"]{color:var(--bad)}
#app{flex:1;display:flex;flex-direction:column;min-width:0}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--panel);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.center{align-items:center;text-align:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.lead{color:var(--muted)}
.lab{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.inp{width:100%;font:800 1.25rem/1.3 var(--body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.inp::placeholder{color:#8f86d6}
.inp:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-color:var(--gold)}
.notice{background:var(--bg-2);border-radius:12px;padding:12px 16px;color:var(--muted)}
.notice.err{background:#5a1630;color:#ffd1d8}
.btn{font:400 1.25rem/1 var(--display);letter-spacing:.02em;border:0;border-radius:14px;padding:15px 22px;min-height:52px;background:var(--gold);color:var(--on-gold);box-shadow:0 5px 0 #b38a00;cursor:pointer}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #b38a00}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:focus-visible,.opt:focus-visible,.seg button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.actions.between{justify-content:space-between;align-items:center}
.seg{display:flex;gap:8px}
.seg button{flex:1;font:800 1rem/1.2 var(--body);padding:12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.pin{font:400 clamp(3.2rem,16vw,7.5rem)/1 var(--display);letter-spacing:.1em;padding-left:.1em;color:var(--gold);font-variant-numeric:tabular-nums;user-select:all}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--bg-2);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;overflow-wrap:anywhere;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:8px;background:var(--bg-2);color:var(--muted)}
.tag.r{color:var(--gold)}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avb{font-size:1.5rem;line-height:1;padding:6px 0;border-radius:10px;border:2px solid var(--line);background:transparent;cursor:pointer}
.avb[aria-pressed="true"]{border-color:var(--gold);background:var(--bg-2)}
.avb:focus-visible{outline:3px solid #fff;outline-offset:2px}
.opt.sel{outline:3px solid var(--gold);outline-offset:2px}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--gold)}
.emos{display:flex;flex-wrap:wrap;gap:8px}
.emob{font-size:1.9rem;line-height:1;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg-2);cursor:pointer}
.emob:active{transform:scale(.92)}
.emob:focus-visible{outline:3px solid #fff;outline-offset:2px}
.emfeed{display:grid;gap:6px;max-height:220px;overflow:auto}
.emrow{display:flex;gap:10px;align-items:center;font-weight:700;animation:pop .25s ease-out}
.ememo{font-size:1.6rem}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.catb{font:700 .85rem/1.2 var(--body);padding:9px 12px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.catb[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.catb:focus-visible{outline:3px solid #fff;outline-offset:3px}
.clock{margin-left:auto;font:400 1.8rem/1 var(--display);min-width:54px;height:54px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);transform-origin:left center}
.q{font:400 clamp(1.5rem,3.4vw + .7rem,3rem)/1.15 var(--display);overflow-wrap:anywhere;text-wrap:balance}
.q.small{font-size:clamp(1.2rem,2vw + .6rem,1.8rem)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.opt{display:flex;align-items:center;gap:14px;min-height:84px;padding:14px 18px;border:0;border-radius:16px;color:#fff;font:800 clamp(1.05rem,1.6vw + .7rem,1.55rem)/1.2 var(--body);text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.3);min-width:0;overflow-wrap:anywhere}
button.opt{cursor:pointer;width:100%}
button.opt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.opt[data-i="0"]{background:var(--a0)}
.opt[data-i="1"]{background:var(--a1)}
.opt[data-i="2"]{background:var(--a2);color:var(--on-a2)}
.opt[data-i="3"]{background:var(--a3)}
.opt .otext{min-width:0}
.shape{width:30px;height:30px;flex:none}
.opt .count{margin-left:auto;font:400 1.6rem/1 var(--display);background:rgba(0,0,0,.25);border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums}
.opt .mark{margin-left:auto;font:400 1.7rem/1 var(--display)}
.opt .count+.mark{margin-left:6px}
.opt.dim{opacity:.32;box-shadow:none}
.opt.ok{outline:5px solid var(--good);outline-offset:2px}
.note{background:var(--bg-2);border-radius:14px;padding:12px 16px}
.cnt{font-weight:800;color:var(--muted)}
.result{border-radius:22px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.result.good{background:#1d8f47}
.result.bad{background:#c9304a}
.result.none{background:var(--panel)}
.big{font:400 clamp(2.4rem,10vw,4rem)/1.05 var(--display)}
.gain{font:400 2.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.board{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.brow{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--bg-2);border-radius:12px;padding:10px 14px}
.brow.me{outline:3px solid var(--gold)}
.rk{font:400 1.2rem/1 var(--display);color:var(--gold)}
.nm{font-weight:800;overflow-wrap:anywhere;min-width:0}
.pts{font:400 1.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.gn{font-weight:800;color:var(--good);font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:right}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:260px}
.pc{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pc .who{font-weight:800;text-align:center;overflow-wrap:anywhere}
.pc .sc{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pc .step{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:10px;font:400 2rem/1 var(--display);color:var(--on-gold);transform-origin:bottom center;animation:rise .7s ease-out both}
.pc[data-p="1"] .step{height:150px;background:var(--gold)}
.pc[data-p="2"] .step{height:110px;background:#cfd3e6;animation-delay:.15s}
.pc[data-p="3"] .step{height:80px;background:#d99a5b;animation-delay:.3s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tag.n{background:var(--gold);color:#1a1240}
#emfly{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.emfly{position:absolute;bottom:-90px;display:flex;flex-direction:column;align-items:center;animation:emrise 3.4s cubic-bezier(.25,.7,.3,1) forwards}
.emfly b{font-size:4.2rem;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));font-weight:400}
.emfly span{font-size:.8rem;font-weight:800;background:rgba(0,0,0,.7);color:#fff;padding:3px 10px;border-radius:99px;margin-top:4px;white-space:nowrap}
.emfly.tome b{font-size:6.4rem;animation:emshake .45s ease-in-out 4}
@keyframes emrise{0%{transform:translateY(0) scale(.4) rotate(-12deg);opacity:0}12%{opacity:1;transform:translateY(-14vh) scale(1.3) rotate(10deg)}40%{transform:translateY(-40vh) scale(1) rotate(-9deg)}70%{opacity:1;transform:translateY(-64vh) scale(1.08) rotate(7deg)}100%{transform:translateY(-88vh) scale(.9) rotate(0);opacity:0}}
@keyframes emshake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-14deg) scale(1.12)}75%{transform:rotate(14deg) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.emfly{bottom:40%;animation:emfade 2.6s forwards}.emfly.tome b{animation:none}@keyframes emfade{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}}

.av{--d:0s;position:relative;display:inline-block;width:1.7em;height:1.7em;margin-right:.4em;vertical-align:middle;flex:none}
.avsvg{width:100%;height:100%;display:block;overflow:visible}
.av .bob{transform-box:fill-box;transform-origin:50% 100%;animation:avbob 2.4s ease-in-out infinite alternate;animation-delay:var(--d)}
.av .eyes{transform-box:fill-box;transform-origin:center;animation:avblink 4.4s infinite;animation-delay:var(--d)}
.av .pup{animation:avlook 5.5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes avbob{from{transform:translateY(1px) rotate(-2.2deg)}to{transform:translateY(-2px) rotate(2.2deg)}}
@keyframes avblink{0%,91%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.08)}}
@keyframes avlook{0%,100%{transform:translate(0,0)}30%{transform:translate(2px,1px)}65%{transform:translate(-2px,0)}}
.av.still .bob,.av.still .eyes,.av.still .pup{animation:none}
@media (prefers-reduced-motion:reduce){.av .bob,.av .eyes,.av .pup{animation:none}}
.chip .av,.brow .av{font-size:1.5rem}
.who .av{font-size:2.6rem;display:block;margin:4px auto 6px}
.emfly span .av{font-size:1.3rem}
.avprev{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.avprev .av{font-size:6rem;margin:6px 10px 0 6px}
.avrow{display:grid;gap:6px}
.avlab{margin:0;font-weight:800;color:var(--gold);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
.avs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;min-width:0}
.avb{padding:6px;display:block;min-width:0;width:100%}
.avb .av{display:block;position:relative;width:100%;height:0;padding-bottom:100%;margin:0}
.avb .av .avsvg{position:absolute;left:0;top:0;width:100%;height:100%}
.avb .nonebox::after{content:'✖';position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;opacity:.6;font-size:1.3rem}
.avrow{min-width:0}
.avprev .btn{white-space:nowrap;padding-left:14px;padding-right:14px}
</style>
</head>

function parseNum(t){

function startClock(lim){

  expired=false;

  rafId=requestAnimationFrame(frame);
}

function frame(){
  if(!deadline) return;

/* ---------- red: conexión directa entre navegadores (PeerJS, topología en estrella) ---------- */
const PREFIX='duelo-ingenio-';
function merge(t,patch){
  for(const k in patch){ if(patch[k]===null) delete t[k]; else t[k]=patch[k]; }
  return t;
}
function baseRoom(){
  const subs=new Set(), cons=new Set();
  const r={connected:false};
  r.emitPeers=()=>{ subs.forEach(f=>{ try{ f({}); }catch(e){ console.error(e); } }); };
  r.setConn=v=>{ r.connected=v; cons.forEach(f=>{ try{ f(v); }catch(e){ console.error(e); } }); };
  r.onPeers=fn=>{ subs.add(fn); queueMicrotask(()=>{ if(subs.has(fn)) fn({}); }); return ()=>{ subs.delete(fn); }; };
  r.onConnection=fn=>{ cons.add(fn); queueMicrotask(()=>{ if(cons.has(fn)) fn(r.connected); }); return ()=>{ cons.delete(fn); }; };
  return r;
}
function hostRoom(code){
  return new Promise((resolve,reject)=>{
    const id=PREFIX+code, r=baseRoom(), me={}, pl=new Map();
    let timer=0, closed=false;
    const peer=new Peer(id);
    const plist=()=>{ const a=[{peer:id,presence:me}]; pl.forEach((v,k)=>a.push({peer:k,presence:v.presence})); return a; };
    const snapshot=()=>({t:'peers',list:plist()});
    const send=(c,m)=>{ try{ if(c.open) c.send(m); }catch(e){} };
    const broadcast=()=>{
      if(timer) return;
      timer=setTimeout(()=>{ timer=0; const m=snapshot(); pl.forEach(v=>send(v.conn,m)); },60);
    };
    const drop=k=>{ if(pl.delete(k)){ broadcast(); r.emitPeers(); } };
    r.peers=()=>plist().map(x=>({peer:x.peer,kind:'viewer',isMe:x.peer===id,presence:x.presence}));
    r.presence=patch=>{ merge(me,patch); broadcast(); r.emitPeers(); return Promise.resolve(); };
    r.leave=()=>{ closed=true; clearTimeout(timer); try{ peer.destroy(); }catch(e){} return Promise.resolve(); };
    peer.on('open',()=>{ r.setConn(true); resolve(r); });
    peer.on('error',e=>{ if(!r.connected){ try{ peer.destroy(); }catch(x){} reject(e); } });
    peer.on('disconnected',()=>{ if(!closed){ r.setConn(false); try{ peer.reconnect(); }catch(e){} } });
    peer.on('connection',conn=>{
      conn.on('open',()=>send(conn,snapshot()));
      conn.on('data',m=>{
        if(conn._kicked||!m||m.t!=='pres'||!m.p||typeof m.p!=='object') return;
        pl.set(conn.peer,{conn:conn,presence:m.p});
        const nm=String(m.p.name||'').trim().toLowerCase();
        if(nm){
          pl.forEach((o,k)=>{
            if(k!==conn.peer&&String(o.presence.name||'').trim().toLowerCase()===nm){
              o.conn._kicked=true;
              send(o.conn,{t:'kick'});
              setTimeout(()=>{ try{ o.conn.close(); }catch(e){} },150);
              pl.delete(k);
            }
          });
        }
        broadcast();
        r.emitPeers();
      });
      conn.on('close',()=>drop(conn.peer));
      conn.on('error',()=>drop(conn.peer));
    });
  });
}
function joinRoom(code){
  return new Promise((resolve,reject)=>{
    const hostId=PREFIX+code, r=baseRoom(), mine={};
    let remote=[], conn=null, opened=false, closed=false;
    const peer=new Peer();
    const timer=setTimeout(()=>{ if(!opened){ try{ peer.destroy(); }catch(e){} reject({type:'timeout'}); } },12000);
    r.peers=()=>remote.map(x=>({peer:x.peer,kind:'viewer',isMe:x.peer===peer.id,presence:x.presence||{}}));
    r.presence=patch=>{
      merge(mine,patch);
      try{ if(conn&&conn.open) conn.send({t:'pres',p:mine}); }catch(e){}
      return Promise.resolve();
    };
    r.leave=()=>{ closed=true; clearTimeout(timer); try{ peer.destroy(); }catch(e){} return Promise.resolve(); };
    peer.on('open',()=>{
      conn=peer.connect(hostId,{reliable:true,serialization:'json'});
      conn.on('open',()=>{ opened=true; clearTimeout(timer); r.setConn(true); resolve(r); });
      conn.on('data',m=>{
        if(!m) return;
        if(m.t==='peers'&&Array.isArray(m.list)){ remote=m.list; r.emitPeers(); }
        else if(m.t==='kick'&&r.onKick) r.onKick();
      });
      conn.on('close',()=>{ if(closed) return; remote=[]; r.setConn(false); r.emitPeers(); });
      conn.on('error',()=>{});
    });
    peer.on('error',e=>{
      if(!opened){ clearTimeout(timer); try{ peer.destroy(); }catch(x){} reject(e); }
      else r.setConn(false);
    });
  });
}

function startGame(){
  if(!G||G.ph!=='lobby'||!players().length) return;

function nextQuestion(){
  if(!G) return;
  clearTimeout(G.timer);
  G.qn++;
  if(G.qn>=G.order.length){ endGame(); return; }
  const q=BANK[G.order[G.qn]];
  markSeen(q.id);
  players().forEach(p=>score(clean(p.presence.name)));
  G.seq++; G.ph='q'; G.lim=q.t; G.locked=new Map(); G.early=false; G.ok=null;
  G.myA=null; G.myChoice=null; G.gs=null; G.t0=performance.now();
  G.timer=setTimeout(closeQuestion,q.t*1000+1200);
  startClock(q.t);

function collect(){
  if(!G||G.ph!=='q') return;
  const ps=players(), qq=BANK[G.order[G.qn]];
  for(const p of ps){
    const nm=clean(p.presence.name), a=p.presence.a;
    score(nm);
    if(a&&a.s===G.seq&&!G.locked.has(p.peer)){
      let ms=Number(a.ms);
      if(!Number.isFinite(ms)||ms<0) ms=0;
      if(qq.k==='n'){
        const v=Number(a.v);
        if(a.v!==null&&a.v!==undefined&&a.v!==''&&Number.isFinite(v)&&Math.abs(v)<1e15) G.locked.set(p.peer,{v:v,ms:Math.min(ms,G.lim*1000),name:nm});
      }else{
        const c=Number(a.c);
        if(Number.isInteger(c)&&c>=0&&c<4) G.locked.set(p.peer,{c:c,ms:Math.min(ms,G.lim*1000),name:nm});
      }
    }
  }
  updateCount();
  if(!G.early&&ps.length&&ps.every(p=>G.locked.has(p.peer))){
    G.early=true;
    clearTimeout(G.timer);
    G.timer=setTimeout(closeQuestion,600);
  }
}
function closeQuestion(){
  if(!G||G.ph!=='q') return;
  clearTimeout(G.timer);
  stopClock();
  collect();
  const q=BANK[G.order[G.qn]];
  if(q.k==='n'){ closeNum(q); return; }
  const dist=[0,0,0,0], done=new Set();
  for(const l of G.locked.values()){
    if(done.has(l.name)) continue;
    done.add(l.name);
    dist[l.c]++;
    const s=score(l.name);
    if(l.c===q.c){
      s.streak++;
      const base=Math.round(1000*(1-(l.ms/(q.t*1000))/2));
      s.gain=base+Math.min(s.streak-1,4)*100;
      s.res=1;
    }else{
      s.streak=0; s.gain=0; s.res=0;
    }
    s.total+=s.gain;
  }
  for(const [n,s] of G.scores){
    if(!done.has(n)){ s.streak=0; s.gain=0; s.res=-1; }
  }
  G.dist=dist; G.ok=q.c; G.ph='rev'; G.board=makeBoard();
  pubHost();
  render();
}
function closeNum(q){
  const arr=[], done=new Set();
  for(const l of G.locked.values()){
    if(done.has(l.name)) continue;
    done.add(l.name);
    arr.push({name:l.name,v:l.v,e:Math.abs(l.v-q.num),ms:l.ms});
  }
  arr.sort((a,b)=>a.e-b.e||a.ms-b.ms);
  let rk=-1, pe=null;
  arr.forEach(x=>{ if(pe===null||x.e!==pe){ rk++; pe=x.e; } x.r=rk; });
  arr.forEach(x=>{
    const s=score(x.name);
    s.gain=Math.max(100,1000-200*x.r);
    if(x.r===0){ s.streak++; s.res=1; } else { s.streak=0; s.res=0; }
    s.total+=s.gain;
  });
  for(const [n,s] of G.scores){
    if(!done.has(n)){ s.streak=0; s.gain=0; s.res=-1; }
  }
  G.dist=[0,0,0,0]; G.ok=0; G.gs=arr.slice(0,6).map(x=>[x.name,x.v,x.r]);
  G.ph='rev'; G.board=makeBoard();
  pubHost();
  render();
}

function emSet(){
  const name=myName(), b=endBoard(), r=ranks(b), i=b.findIndex(e=>e[0]===name);
  if(i<0||b.length<2) return {l:'Reaccioná',a:EM_MID};
  if(r[i]===1) return {l:'Sos el campeón: burlate de alguien',a:EM_WIN};
  if(r[i]===r[b.length-1]) return {l:'Último lugar: desahogate',a:EM_LAST};
  return {l:'Reaccioná',a:EM_MID};
}
function sendEm(e){
  if(!EM_ALL.has(e)) return;
  const now=Date.now();
  if(now-emLast<1500) return;
  emLast=now;
  if(emTarget&&playerNames().indexOf(emTarget)<0) emTarget='';
  const em={n:++emN,e:e,t:emTarget,g:curGen(),ts:now};
  if(role==='host'){
    if(!G||!G.me||G.ph!=='end') return;
    G.myEm=em; pubHost(); fillFeed();
  }else if(room&&Pl){
    room.presence({em:em}).catch(()=>{});
  }
}
let emSeenK=new Set(), emGenSeen=null;
function flyEm(x){
  let box=document.getElementById('emfly');
  if(!box){ box=document.createElement('div'); box.id='emfly'; box.setAttribute('aria-hidden','true'); document.body.appendChild(box); }
  if(box.children.length>7) return;
  const tome=x.em.t&&clean(x.em.t)===myName();
  const d=document.createElement('div');
  d.className='emfly'+(tome?' tome':'');
  d.style.left=(8+Math.random()*68)+'%';
  const b=document.createElement('b'); b.textContent=x.em.e;
  const s=document.createElement('span'); s.append(avNode(x.n),x.n+(x.em.t?' → '+clean(x.em.t):''));
  d.append(b,s);
  d.addEventListener('animationend',e=>{ if(e.target===d) d.remove(); });
  setTimeout(()=>{ d.remove(); },4200);
  box.appendChild(d);
  if(tome){ try{ navigator.vibrate&&navigator.vibrate([120,60,120]); }catch(e){} }
}
function fillFeed(){
  const box=document.getElementById('emfeed');
  if(!box||!room) return;
  const g=curGen();
  const list=players().map(p=>({n:clean(p.presence.name),em:p.presence.em}))
    .filter(x=>x.em&&typeof x.em==='object'&&EM_ALL.has(x.em.e)&&x.em.g===g)
    .sort((a,b)=>(Number(a.em.ts)||0)-(Number(b.em.ts)||0));
  const kf=x=>[x.n,x.em.n,x.em.ts,x.em.g].join('|');
  if(emGenSeen!==g){ emGenSeen=g; emSeenK=new Set(list.map(kf)); }
  else list.forEach(x=>{ const k=kf(x); if(!emSeenK.has(k)){ emSeenK.add(k); flyEm(x); } });
  list.splice(0,Math.max(0,list.length-8));
  box.replaceChildren();
  if(!list.length){ box.append(el('p',{class:'lead',text:'Todavía no hay emotes.'})); return; }
  list.forEach(x=>box.append(el('div',{class:'emrow'},
    el('span',{class:'ememo',text:x.em.e}),
    el('span',{},avNode(x.n),x.n+(x.em.t?' → '+clean(x.em.t):'')))));
}
function rebuildEm(){
  const old=document.getElementById('empanel');
  if(old){ old.replaceWith(buildEmotes()); fillFeed(); }
}
function buildEmotes(){
  const name=myName(), set=name?emSet():null;
  const others=playerNames().filter(n=>n!==name).slice(0,12);
  return el('section',{class:'panel',id:'empanel'},
    el('h3',{text:'Emotes'}),
    set?el('p',{class:'lead',text:set.l}):el('p',{class:'lead',text:'Mirá cómo reaccionan los jugadores.'}),
    set&&others.length?el('div',{class:'cats',role:'group','aria-label':'Destinatario'},
      [['','A todos']].concat(others.map(n=>[n,n])).map(x=>el('button',{type:'button',class:'catb','aria-pressed':String(emTarget===x[0]),onclick:()=>{emTarget=x[0];rebuildEm();},text:x[1]}))):null,
    set?el('div',{class:'emos'},set.a.map(e=>el('button',{type:'button',class:'emob','aria-label':'Emote '+e,onclick:()=>sendEm(e),text:e}))):null,
    el('div',{id:'emfeed',class:'emfeed',role:'log','aria-live':'polite'}));
}

/* ---------- pantallas ---------- */
function histText(){
  let all=0, fresh=0;
  selCats.forEach(c=>{ const t=catStats(c); all+=t.all; fresh+=t.fresh; });
  return 'Sin jugar todavía con esta selección: '+fmt(fresh)+' de '+fmt(all)+'.'+(all<selTotal?' Hay pocas preguntas con esta combinación: la partida va a ser más corta.':'');
}
function setAv(part,val){
  const a=avParse(selAv)||{c:CHL[0],h:'',g:'',e:''};
  a[part]=val;
  selAv=avStr(a); lsSet('di-av',selAv); render();
}
function randAv(){
  const pick=l=>Math.random()<.6?l[Math.floor(Math.random()*l.length)]:'';
  selAv=avStr({c:CHL[Math.floor(Math.random()*CHL.length)],h:pick(HATK),g:pick(GLAK),e:pick(EXAK)}); lsSet('di-av',selAv); render();
}
function buildAvPanel(){
  const a=avParse(selAv)||{c:CHL[0],h:'',g:'',e:''};
  const opt=(part,id,label,cur,nm)=>{
    const t=Object.assign({},a); t[part]=id;
    return el('button',{type:'button',class:'avb','aria-pressed':String(id===cur),'aria-label':label+': '+(nm||'ninguno'),onclick:()=>setAv(part,id)},
      id===''&&part!=='c'?el('span',{class:'av nonebox','aria-hidden':'true'}):avBuild(avStr(t),true));
  };
  const row=(label,part,keys,map,cur)=>el('div',{class:'avrow'},
    el('p',{class:'avlab',text:label}),
    el('div',{class:'avs',role:'group','aria-label':label},[''].concat(keys).map(k=>opt(part,k,label,cur,k?map[k].n:''))));
  return el('section',{class:'panel'},
    el('h2',{text:'Tu avatar'}),
    el('div',{class:'avprev'},avBuild(selAv),
      el('button',{type:'button',class:'btn ghost',onclick:randAv,text:'🎲 Al azar'})),
    el('div',{class:'avrow'},
      el('p',{class:'avlab',text:'Personaje'}),
      el('div',{class:'avs',role:'group','aria-label':'Personaje'},CHL.map(k=>opt('c',k,'Personaje',a.c,CH[k].n)))),
    row('Gorro','h',HATK,HAT,a.h), row('Lentes','g',GLAK,GLA,a.g), row('Extra','e',EXAK,EXA,a.e));
}

  const ready=lobbyState==='ready';
  const msg=lobbyState==='pending'?'Conectando con la sala en vivo…'
    :lobbyState==='none'?'No se pudo cargar el servicio de conexión. Revisá tu internet y recargá la página.':'';
  const pinIn=el('input',{id:'pin',class:'inp',type:'text',inputmode:'numeric',maxlength:'6',autocomplete:'off',placeholder:'000000',value:inPin,
    oninput:e=>{inPin=e.target.value.replace(/\D/g,'').slice(0,6);e.target.value=inPin;}});
  const nickIn=el('input',{id:'nick',class:'inp',type:'text',maxlength:'14',autocomplete:'nickname',placeholder:'Tu apodo',value:inNick,
    oninput:e=>{inNick=e.target.value;}});
  const join=el('form',{class:'panel',onsubmit:e=>{e.preventDefault();joinGame();}},
    el('h2',{text:'Unirme a una partida'}),
    el('p',{class:'lead',text:'Pedile el PIN a quien organiza y elegí un apodo.'}),
    el('div',{class:'field'},el('label',{class:'lab','for':'pin',text:'PIN'}),pinIn),

  const seg=el('div',{class:'seg',role:'group','aria-label':'Cantidad de preguntas'},
    [10,20,30].map(n=>el('button',{type:'button','aria-pressed':String(selTotal===n),onclick:()=>{selTotal=n;render();},text:n+' preguntas'})));
  const host=el('section',{class:'panel'},
    el('h2',{text:'Crear una partida'}),
    el('p',{class:'lead',text:'Proyectá esta pantalla y los demás juegan desde el celular. Elegí las categorías: las preguntas se mezclan y se evita repetir las que ya jugaste en este dispositivo.'}),
    seg,
    el('div',{class:'seg',role:'group','aria-label':'Nivel'},
      [[-1,'Todos'],[0,'Fácil'],[1,'Medio'],[2,'Difícil']].map(x=>el('button',{type:'button','aria-pressed':String(selLv===x[0]),onclick:()=>{selLv=x[0];lsSet('di-lv',selLv);render();},text:x[1]}))),
    el('div',{class:'cats',role:'group','aria-label':'Categorías'},
      CATS.map((n,i)=>el('button',{type:'button',class:'catb','aria-pressed':String(selCats.has(i)),onclick:()=>{toggleCat(i);render();},text:n+' · '+catStats(i).all}))),
    el('p',{class:'lead',text:histText()}),
    el('div',{class:'actions'},
      el('button',{class:'btn ghost',type:'button',onclick:()=>{CATS.forEach((_,i)=>selCats.add(i));lsSet('di-cats',[...selCats]);render();},text:'Todas'}),
      el('button',{class:'btn ghost',type:'button',disabled:!seen.size,onclick:()=>{seen.clear();lsSet('di-seen',[]);render();},text:'Reiniciar historial'})),
    el('label',{class:'chk'},el('input',{type:'checkbox',checked:hostPlay,onchange:e=>{hostPlay=e.target.checked;lsSet('di-hp',hostPlay);render();}}),el('span',{text:'Quiero jugar yo también'})),
    hostPlay?el('input',{id:'hnick',class:'inp',type:'text',maxlength:'14',autocomplete:'off',placeholder:'Tu apodo como jugador',value:hostNick,oninput:e=>{hostNick=e.target.value;}}):null,
    el('button',{class:'btn',type:'button',disabled:!ready,onclick:createGame,text:'Crear partida'}));
  return el('div',{class:'stack'},
    el('div',{class:'stack'},
      el('h1',{text:'¿Quién la tiene más clara?'}),
      el('p',{class:'lead',text:'Trivia, acertijos y más de mil preguntas para jugar en grupo. Contestar rápido suma más puntos.'})),
    msg?el('p',{class:'notice',role:'status',text:msg}):null,
    err?el('p',{class:'notice err',role:'alert',text:err}):null,
    buildAvPanel(),
    el('div',{class:'grid2'},join,host));
}

  return el('div',{class:'stack'},
    el('section',{class:'panel center'},
      el('span',{class:'lab',text:'PIN de la partida'}),
      el('div',{class:'pin',text:pin}),
      el('p',{class:'lead',text:'Los jugadores abren este mismo enlace, tocan «Unirme a una partida» y escriben el PIN.'})),

    el('div',{class:'actions'},

      el('button',{class:'btn ghost',type:'button',onclick:leaveAll,text:'Cancelar'})));

function buildHostQ(){
  const q=BANK[G.order[G.qn]];
  return el('div',{class:'stack'},
    qhead(q,G.qn+1,G.order.length,true),
    el('div',{class:'bar'},el('i',{id:'barfill'})),
    el('h2',{class:'q',text:q.q}),
    q.k==='n'?(G.me&&G.myChoice===null&&!expired?numForm(q,hostNum):el('section',{class:'panel center'},el('p',{class:'lead',role:'status',text:G.me?(G.myChoice!==null?'Tu respuesta quedó registrada: '+fmtN(G.myChoice,q):'Se acabó tu tiempo.'):'Los jugadores están escribiendo su estimación…'}))):
    el('div',{class:'opts'},q.o.map((_,i)=>optEl(q,i,G.me&&G.myChoice===null&&!expired?{onclick:()=>hostAnswer(i)}:{cls:G.myChoice===i?'sel':''}))),
    q.k!=='n'&&G.me?el('p',{class:'lead',role:'status',text:G.myChoice!==null?'Tu respuesta quedó registrada.':(expired?'Se acabó tu tiempo.':'Tocá tu respuesta: vos también jugás.')}):null,

      el('span',{id:'cnt',class:'cnt',role:'status',text:cntText()}),
      el('button',{class:'btn ghost',type:'button',onclick:closeQuestion,text:'Cerrar pregunta'})));

    el('section',{class:'panel'},

function buildHostEnd(){
  const b=G.board, r=ranks(b);
  return el('div',{class:'stack'},
    el('h1',{text:'Podio final'}),
    podium(b,r),

    buildEmotes(),
    el('div',{class:'actions'},
      el('button',{class:'btn',type:'button',onclick:playAgain,text:'Jugar de nuevo'}),
      el('button',{class:'btn ghost',type:'button',onclick:leaveAll,text:'Cerrar partida'})));
}
function buildPLobby(){
  const names=playerNames();
  return el('div',{class:'stack'},
    el('section',{class:'panel center'},
      el('h2',{text:'¡Estás dentro, '+Pl.name+'!'}),
      el('p',{class:'lead',role:'status',text:'Esperá a que el anfitrión empiece la partida.'})),
    el('section',{class:'panel'},
      el('h3',{text:'En la sala ('+names.length+')'}),
      el('div',{class:'chips'},names.map(n=>el('span',{class:'chip'},avNode(n),n)))),
    el('div',{class:'actions'},el('button',{class:'btn ghost',type:'button',onclick:leaveAll,text:'Salir'})));
}
function buildPQ(){
  const H=hostPresence();
  const q=H?BANK[H.qi]:null;
  if(!q) return waitCard('Preparando la pregunta…','');
  if(Pl.seq===Pl.skipSeq) return waitCard('Entraste en medio de una pregunta','Jugás desde la próxima.');
  if(Pl.choice!==null){
    return el('div',{class:'stack'},
      waitCard('Respuesta enviada','Esperando al resto del grupo…'),
      q.k==='n'?el('section',{class:'panel center'},el('p',{class:'lead',text:'Tu respuesta: '+fmtN(Pl.choice,q)})):optEl(q,Pl.choice,{}));
  }
  if(expired) return waitCard('Se acabó el tiempo','Esperá el resultado.');
  return el('div',{class:'stack'},
    qhead(q,H.qn+1,H.total,true),
    el('div',{class:'bar'},el('i',{id:'barfill'})),
    el('h2',{class:'q small',text:q.q}),
    q.k==='n'?numForm(q,answerNum):el('div',{class:'opts'},q.o.map((_,i)=>optEl(q,i,{onclick:()=>answer(i)}))));
}
function buildPRev(){
  const H=hostPresence();
  const b=H&&Array.isArray(H.b)?H.b:[];
  const r=ranks(b);
  const i=b.findIndex(e=>e[0]===Pl.name);
  const q=H?BANK[H.qi]:null;
  if(i<0) return waitCard('Mirá la pantalla del anfitrión','Todavía no tenés puntaje en esta partida.');
  const e=b[i], res=e[3];
  const isN=q&&q.k==='n';
  let gap;
  if(r[i]===1) gap='¡Vas primero!';
  else if(b[i-1][1]-e[1]>0) gap='A '+fmt(b[i-1][1]-e[1])+' pts de '+b[i-1][0];
  else gap='Empatás con '+b[i-1][0];
  return el('div',{class:'stack'},
    el('section',{class:'result '+(res===1?'good':res===0&&!isN?'bad':'none')},
      el('div',{class:'big',role:'status',text:isN?(res===1?'¡El más cercano!':res===0?'Quedaste a '+fmt(Math.abs(Math.round(((Pl.myNum||0)-q.num)*1000)/1000)):'No respondiste'):(res===1?'¡Correcto!':res===0?'Incorrecto':'No respondiste')}),
      (isN?res!==-1:res===1)?el('div',{class:'gain',text:(e[2]>0?'+'+fmt(e[2]):'+0')}):null,
      e[4]>=2?el('div',{text:'Racha de '+e[4]+' '+(isN?'veces el más cercano':'aciertos')}):null,
      isN?el('div',{text:'La respuesta era: '+fmtN(q.num,q)}):(res!==1&&q&&H.ok!=null?el('div',{text:'La respuesta era: '+q.o[H.ok]}):null)),
    isN&&Array.isArray(H.gs)?numReveal(q,H.gs,Pl.name):null,
    el('section',{class:'panel center'},
      el('h2',{text:'Vas '+r[i]+'.º de '+b.length+' · '+fmt(e[1])+' pts'}),
      el('p',{class:'lead',text:gap}),
      el('p',{class:'lead',text:'Esperá la próxima pregunta.'})));
}
function buildPEnd(){
  const H=hostPresence();
  const b=H&&Array.isArray(H.b)?H.b:[];
  const r=ranks(b);
  const i=b.findIndex(e=>e[0]===Pl.name);
  return el('div',{class:'stack'},
    el('section',{class:'panel center'},
      el('h1',{text:i>=0?'Terminaste '+r[i]+'.º':'Terminó la partida'}),
      i>=0?el('p',{class:'lead',text:fmt(b[i][1])+' puntos en total.'}):null),
    podium(b,r),
    buildEmotes(),
    el('div',{class:'actions'},el('button',{class:'btn',type:'button',onclick:leaveAll,text:'Salir'})));
}
function buildHostWait(){ return waitCard('Reconectando con el anfitrión…','Un momento.'); }
function buildHostGone(){
  return el('section',{class:'panel center'},
    el('h2',{text:'El anfitrión se desconectó'}),
    el('p',{class:'lead',text:'La partida terminó o se perdió la conexión.'}),
    el('button',{class:'btn',type:'button',onclick:leaveAll,text:'Volver al inicio'}));
}
const BUILD={
  home:buildHome, connecting:buildConnecting, hostLobby:buildHostLobby, hostQ:buildHostQ, hostRev:buildHostRev,
  hostEnd:buildHostEnd, pLobby:buildPLobby, pQ:buildPQ, pRev:buildPRev, pEnd:buildPEnd, hostWait:buildHostWait, hostGone:buildHostGone
};

/* ---------- qué pantalla toca ---------- */
function view(){
  if(!role) return {n:'home',k:[lobbyState,err,selAv,selLv,hostPlay?1:0,selTotal,[...selCats].join(','),seen.size,bad.size].join('|')};
  if(role==='host'){
    if(!G||!G.ready) return {n:'connecting',k:'c'};
    if(G.ph==='lobby') return {n:'hostLobby',k:playerNames().join('\u0001')+'|'+G.order.length};
    if(G.ph==='q') return {n:'hostQ',k:G.seq+'|'+G.myChoice+'|'+(expired?1:0)};
    if(G.ph==='rev') return {n:'hostRev',k:G.seq+'|'+(bad.has(BANK[G.order[G.qn]].id)?1:0)};
    return {n:'hostEnd',k:String(G.gen)};
  }
  if(!Pl||!Pl.hostSeen) return {n:'connecting',k:'c'};
  const H=hostPresence();
  if(!H){
    if(!Pl.goneAt){ Pl.goneAt=Date.now(); setTimeout(render,3200); }
    return Date.now()-Pl.goneAt<3000?{n:'hostWait',k:'w'}:{n:'hostGone',k:'g'};
  }
  Pl.goneAt=0;
  if(H.ph==='lobby') return {n:'pLobby',k:playerNames().join('\u0001')};
  if(H.ph==='q') return {n:'pQ',k:[H.seq,Pl.choice,expired?1:0,Pl.seq===Pl.skipSeq?1:0].join('|')};
  if(H.ph==='rev') return {n:'pRev',k:String(H.seq)};
  return {n:'pEnd',k:String(H.gen)};
}
function render(){
  const v=view();
  const key=v.n+'#'+v.k;
  if(key===lastKey) return;
  lastKey=key;
  app.replaceChildren(BUILD[v.n]());
  fillFeed();
  window.scrollTo(0,0);
}

/* ---------- arranque ---------- */
lobby=window.Peer?Net:null;
lobbyState=lobby?'ready':'none';
render();
})();
