<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duelo de Ingenio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: una columna centrada tipo consola de juego. El anfitrión proyecta la pantalla grande; los jugadores contestan con botones grandes desde el celular. Un solo mundo visual (índigo profundo, respuestas en cuatro colores con forma propia). */
:root{
  --bg:#1a1446;
  --bg-2:#271d66;
  --panel:#33298a;
  --line:#4a3fb0;
  --ink:#f7f4ff;
  --muted:#c3bcf0;
  --gold:#ffd23f;
  --on-gold:#2a2000;
  --a0:#e63e63;
  --a1:#2a6fe6;
  --a2:#f2b705;
  --a3:#1e9a49;
  --on-a2:#2a2000;
  --good:#46e08a;
  --bad:#ff6b81;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background-color:var(--bg);
  background-image:radial-gradient(900px 480px at 50% -8%,var(--bg-2),transparent 70%);
  background-repeat:no-repeat;
  color:var(--ink);
  font:500 1rem/1.5 var(--body);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;text-wrap:balance;overflow-wrap:anywhere}
h1{font-size:clamp(2.2rem,8vw,3.8rem);line-height:1.05}
h2{font-size:1.5rem;line-height:1.2}
h3{font-size:1.2rem}
p{margin:0}
.shell{max-width:1040px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:400 1.3rem/1 var(--display);letter-spacing:.02em;color:var(--gold)}
.pill{font-size:.8rem;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--panel);color:var(--muted)}
.pill[data-ok="1"]{color:var(--good)}
.pill[data-ok="0"]{color:var(--bad)}
#app{flex:1;display:flex;flex-direction:column;min-width:0}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--panel);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.center{align-items:center;text-align:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.lead{color:var(--muted)}
.lab{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.inp{width:100%;font:800 1.25rem/1.3 var(--body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.inp::placeholder{color:#8f86d6}
.inp:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-color:var(--gold)}
.notice{background:var(--bg-2);border-radius:12px;padding:12px 16px;color:var(--muted)}
.notice.err{background:#5a1630;color:#ffd1d8}
.btn{font:400 1.25rem/1 var(--display);letter-spacing:.02em;border:0;border-radius:14px;padding:15px 22px;min-height:52px;background:var(--gold);color:var(--on-gold);box-shadow:0 5px 0 #b38a00;cursor:pointer}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #b38a00}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:focus-visible,.opt:focus-visible,.seg button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.actions.between{justify-content:space-between;align-items:center}
.seg{display:flex;gap:8px}
.seg button{flex:1;font:800 1rem/1.2 var(--body);padding:12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.pin{font:400 clamp(3.2rem,16vw,7.5rem)/1 var(--display);letter-spacing:.1em;padding-left:.1em;color:var(--gold);font-variant-numeric:tabular-nums;user-select:all}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--bg-2);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;overflow-wrap:anywhere;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:8px;background:var(--bg-2);color:var(--muted)}
.tag.r{color:var(--gold)}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avb{font-size:1.5rem;line-height:1;padding:6px 0;border-radius:10px;border:2px solid var(--line);background:transparent;cursor:pointer}
.avb[aria-pressed="true"]{border-color:var(--gold);background:var(--bg-2)}
.avb:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.catb{font:700 .85rem/1.2 var(--body);padding:9px 12px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.catb[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.catb:focus-visible{outline:3px solid #fff;outline-offset:3px}
.clock{margin-left:auto;font:400 1.8rem/1 var(--display);min-width:54px;height:54px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);transform-origin:left center}
.q{font:400 clamp(1.5rem,3.4vw + .7rem,3rem)/1.15 var(--display);overflow-wrap:anywhere;text-wrap:balance}
.q.small{font-size:clamp(1.2rem,2vw + .6rem,1.8rem)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.opt{display:flex;align-items:center;gap:14px;min-height:84px;padding:14px 18px;border:0;border-radius:16px;color:#fff;font:800 clamp(1.05rem,1.6vw + .7rem,1.55rem)/1.2 var(--body);text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.3);min-width:0;overflow-wrap:anywhere}
button.opt{cursor:pointer;width:100%}
button.opt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.opt[data-i="0"]{background:var(--a0)}
.opt[data-i="1"]{background:var(--a1)}
.opt[data-i="2"]{background:var(--a2);color:var(--on-a2)}
.opt[data-i="3"]{background:var(--a3)}
.opt .otext{min-width:0}
.shape{width:30px;height:30px;flex:none}
.opt .count{margin-left:auto;font:400 1.6rem/1 var(--display);background:rgba(0,0,0,.25);border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums}
.opt .mark{margin-left:auto;font:400 1.7rem/1 var(--display)}
.opt .count+.mark{margin-left:6px}
.opt.dim{opacity:.32;box-shadow:none}
.opt.ok{outline:5px solid var(--good);outline-offset:2px}
.note{background:var(--bg-2);border-radius:14px;padding:12px 16px}
.cnt{font-weight:800;color:var(--muted)}
.result{border-radius:22px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.result.good{background:#1d8f47}
.result.bad{background:#c9304a}
.result.none{background:var(--panel)}
.big{font:400 clamp(2.4rem,10vw,4rem)/1.05 var(--display)}
.gain{font:400 2.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.board{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.brow{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--bg-2);border-radius:12px;padding:10px 14px}
.brow.me{outline:3px solid var(--gold)}
.rk{font:400 1.2rem/1 var(--display);color:var(--gold)}
.nm{font-weight:800;overflow-wrap:anywhere;min-width:0}
.pts{font:400 1.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.gn{font-weight:800;color:var(--good);font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:right}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:260px}
.pc{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pc .who{font-weight:800;text-align:center;overflow-wrap:anywhere}
.pc .sc{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pc .step{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:10px;font:400 2rem/1 var(--display);color:var(--on-gold);transform-origin:bottom center;animation:rise .7s ease-out both}
.pc[data-p="1"] .step{height:150px;background:var(--gold)}
.pc[data-p="2"] .step{height:110px;background:#cfd3e6;animation-delay:.15s}
.pc[data-p="3"] .step{height:80px;background:#d99a5b;animation-delay:.3s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  const cats=[...selCats];
  const usable=c=>BANK.map((q,i)=>i).filter(i=>BANK[i].cat===c&&!bad.has(BANK[i].id));
  const fresh=cats.map(c=>shuffle(usable(c).filter(i=>!seen.has(BANK[i].id))));
  const stale=cats.map(c=>shuffle(usable(c).filter(i=>seen.has(BANK[i].id))));
  const out=[], usedG=new Set();
  while(out.length<n){
    let moved=false;
    for(const k of shuffle(cats.map((_,i)=>i))){
      if(out.length>=n) break;
      const src=fresh[k].length?fresh[k]:stale[k];
      while(src.length){
        const i=src.shift(), g=BANK[i].g;
        if(g&&usedG.has(g)) continue;
        if(g) usedG.add(g);
        out.push(i); moved=true; break;
      }
    }
    if(!moved) break;
  }
  return out;
}
function ranks(b){
  const r=[];
  b.forEach((e,i)=>r.push(i>0&&e[1]===b[i-1][1]?r[i-1]:i+1));

/* ---------- reloj (barra + número) ---------- */
function startClock(lim){
  limMs=lim*1000;
  deadline=performance.now()+limMs;
  expired=false;
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(frame);
}
function stopClock(){
  deadline=0;
  cancelAnimationFrame(rafId);
}
function frame(){
  if(!deadline) return;
  const left=Math.max(0,deadline-performance.now());
  const fill=document.getElementById('barfill'), clk=document.getElementById('clock');
  if(fill) fill.style.transform='scaleX('+(left/limMs)+')';
  if(clk) clk.textContent=Math.ceil(left/1000);
  if(left<=0){ expired=true; render(); return; }
  rafId=requestAnimationFrame(frame);
}

/* ---------- red: conexión directa entre navegadores (PeerJS, topología en estrella) ---------- */
const PREFIX='duelo-ingenio-';
function merge(t,patch){
  for(const k in patch){ if(patch[k]===null) delete t[k]; else t[k]=patch[k]; }
  return t;
}
function baseRoom(){
  const subs=new Set(), cons=new Set();
  const r={connected:false};
  r.emitPeers=()=>{ subs.forEach(f=>{ try{ f({}); }catch(e){ console.error(e); } }); };
  r.setConn=v=>{ r.connected=v; cons.forEach(f=>{ try{ f(v); }catch(e){ console.error(e); } }); };
  r.onPeers=fn=>{ subs.add(fn); queueMicrotask(()=>{ if(subs.has(fn)) fn({}); }); return ()=>{ subs.delete(fn); }; };
  r.onConnection=fn=>{ cons.add(fn); queueMicrotask(()=>{ if(cons.has(fn)) fn(r.connected); }); return ()=>{ cons.delete(fn); }; };
  return r;
}
function hostRoom(code){
  return new Promise((resolve,reject)=>{
    const id=PREFIX+code, r=baseRoom(), me={}, pl=new Map();
    let timer=0, closed=false;
    const peer=new Peer(id);
    const plist=()=>{ const a=[{peer:id,presence:me}]; pl.forEach((v,k)=>a.push({peer:k,presence:v.presence})); return a; };
    const snapshot=()=>({t:'peers',list:plist()});
    const send=(c,m)=>{ try{ if(c.open) c.send(m); }catch(e){} };
    const broadcast=()=>{
      if(timer) return;
      timer=setTimeout(()=>{ timer=0; const m=snapshot(); pl.forEach(v=>send(v.conn,m)); },60);
    };
    const drop=k=>{ if(pl.delete(k)){ broadcast(); r.emitPeers(); } };
    r.peers=()=>plist().map(x=>({peer:x.peer,kind:'viewer',isMe:x.peer===id,presence:x.presence}));
    r.presence=patch=>{ merge(me,patch); broadcast(); r.emitPeers(); return Promise.resolve(); };
    r.leave=()=>{ closed=true; clearTimeout(timer); try{ peer.destroy(); }catch(e){} return Promise.resolve(); };
    peer.on('open',()=>{ r.setConn(true); resolve(r); });
    peer.on('error',e=>{ if(!r.connected){ try{ peer.destroy(); }catch(x){} reject(e); } });
    peer.on('disconnected',()=>{ if(!closed){ r.setConn(false); try{ peer.reconnect(); }catch(e){} } });
    peer.on('connection',conn=>{
      conn.on('open',()=>send(conn,snapshot()));
      conn.on('data',m=>{
        if(conn._kicked||!m||m.t!=='pres'||!m.p||typeof m.p!=='object') return;
        pl.set(conn.peer,{conn:conn,presence:m.p});
        const nm=String(m.p.name||'').trim().toLowerCase();
        if(nm){
          pl.forEach((o,k)=>{
            if(k!==conn.peer&&String(o.presence.name||'').trim().toLowerCase()===nm){
              o.conn._kicked=true;
              send(o.conn,{t:'kick'});
              setTimeout(()=>{ try{ o.conn.close(); }catch(e){} },150);
              pl.delete(k);
            }
          });
        }
        broadcast();
        r.emitPeers();
      });
      conn.on('close',()=>drop(conn.peer));
      conn.on('error',()=>drop(conn.peer));
    });
  });
}
function joinRoom(code){
  return new Promise((resolve,reject)=>{
    const hostId=PREFIX+code, r=baseRoom(), mine={};
    let remote=[], conn=null, opened=false, closed=false;
    const peer=new Peer();
    const timer=setTimeout(()=>{ if(!opened){ try{ peer.destroy(); }catch(e){} reject({type:'timeout'}); } },12000);
    r.peers=()=>remote.map(x=>({peer:x.peer,kind:'viewer',isMe:x.peer===peer.id,presence:x.presence||{}}));
    r.presence=patch=>{
      merge(mine,patch);
      try{ if(conn&&conn.open) conn.send({t:'pres',p:mine}); }catch(e){}
      return Promise.resolve();
    };
    r.leave=()=>{ closed=true; clearTimeout(timer); try{ peer.destroy(); }catch(e){} return Promise.resolve(); };
    peer.on('open',()=>{
      conn=peer.connect(hostId,{reliable:true,serialization:'json'});
      conn.on('open',()=>{ opened=true; clearTimeout(timer); r.setConn(true); resolve(r); });
      conn.on('data',m=>{
        if(!m) return;
        if(m.t==='peers'&&Array.isArray(m.list)){ remote=m.list; r.emitPeers(); }
        else if(m.t==='kick'&&r.onKick) r.onKick();
      });
      conn.on('close',()=>{ if(closed) return; remote=[]; r.setConn(false); r.emitPeers(); });
      conn.on('error',()=>{});
    });
    peer.on('error',e=>{
      if(!opened){ clearTimeout(timer); try{ peer.destroy(); }catch(x){} reject(e); }
      else r.setConn(false);
    });
  });
}
const Net={host:hostRoom,join:joinRoom};

let wake=null;
async function keepAwake(){
  try{
    if(navigator.wakeLock&&!wake){
      wake=await navigator.wakeLock.request('screen');
      wake.addEventListener('release',()=>{ wake=null; });
    }
  }catch(e){}
}

/* ---------- sala ---------- */
function bindRoom(){
  keepAwake();
  unsub=room.onPeers(onPeers,()=>setStat(false));
  unsubConn=room.onConnection(ok=>setStat(ok),()=>setStat(false));
}
function leaveAll(){
  if(G) clearTimeout(G.timer);
  if(Pl) clearTimeout(Pl.timer);
  stopClock();
  if(wake){ try{ wake.release(); }catch(e){} wake=null; }
  try{ if(unsub) unsub(); if(unsubConn) unsubConn(); }catch(e){}
  unsub=null; unsubConn=null;
  const r=room;
  room=null; role=null; G=null; Pl=null; pin='';
  if(r) r.leave().catch(()=>{});
  setStat(false);
  render();
}
function fail(msg){ err=msg; leaveAll(); }
function onPeers(){
  if(!room) return;
  if(role==='host'&&G){ if(G.ph==='q') collect(); render(); }
  else if(role==='player'&&Pl){
    const H=hostPresence();
    if(H&&H.bv!==BV){ fail('Tu página es de otra versión del juego. Recargala (o borrá la caché del navegador) y volvé a entrar.'); return; }
    playerSync(); render();
  }
}

/* ---------- anfitrión ---------- */
function score(name){
  let s=G.scores.get(name);
  if(!s){ s={total:0,gain:0,res:-1,streak:0}; G.scores.set(name,s); }
  return s;
}
function makeBoard(){
  const arr=[...G.scores].map(([n,s])=>[n,s.total,s.gain,s.res,s.streak]);
  arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'es'));
  return arr.slice(0,MAXB);
}
function pubHost(){
  if(!room||!G||!G.ready) return;
  const inQ=G.ph==='q', inRev=G.ph==='rev', inEnd=G.ph==='end';
  room.presence({
    role:'host', pin:pin, bv:BV, ph:G.ph, gen:G.gen, seq:G.seq, qn:G.qn, total:G.order.length,
    qi:(inQ||inRev)?G.order[G.qn]:null,
    lim:inQ?G.lim:null,
    ok:inRev?G.ok:null,
    dist:inRev?G.dist:null,
    b:(inRev||inEnd)?G.board:null
  }).catch(()=>{});
}
async function createGame(){
  if(!lobby||role) return;
  err='';
  pin=String(Math.floor(100000+Math.random()*900000));
  role='host';
  G={ready:false,ph:'lobby',gen:1,seq:0,qn:-1,order:makeOrder(selTotal),want:selTotal,total:0,lim:20,
     locked:new Map(),scores:new Map(),ok:null,dist:[0,0,0,0],board:[],timer:0,early:false};
  G.total=G.order.length;
  render();
  let r=null;
  for(let i=0;i<3&&!r;i++){
    if(role!=='host') return;
    pin=String(Math.floor(100000+Math.random()*900000));
    try{ r=await lobby.host(pin); }
    catch(e){ if(!(e&&e.type==='unavailable-id')) break; }
  }
  if(!r){ fail('No se pudo crear la sala. Revisá tu internet y probá de nuevo.'); return; }
  if(role!=='host'||!G){ r.leave().catch(()=>{}); return; }
  room=r;
  bindRoom();
  G.ready=true;
  pubHost();
  render();
}
function startGame(){
  if(!G||G.ph!=='lobby'||!players().length) return;
  G.scores=new Map();
  G.qn=-1;
  nextQuestion();
}
function nextQuestion(){
  if(!G) return;
  clearTimeout(G.timer);
  G.qn++;
  if(G.qn>=G.order.length){ endGame(); return; }
  const q=BANK[G.order[G.qn]];
  markSeen(q.id);
  players().forEach(p=>score(clean(p.presence.name)));
  G.seq++; G.ph='q'; G.lim=q.t; G.locked=new Map(); G.early=false; G.ok=null;
  G.timer=setTimeout(closeQuestion,q.t*1000+1200);
  startClock(q.t);
  pubHost();
  render();
}
function collect(){
  if(!G||G.ph!=='q') return;
  const ps=players();
  for(const p of ps){
    const nm=clean(p.presence.name), a=p.presence.a;
    score(nm);
    if(a&&a.s===G.seq&&!G.locked.has(p.peer)){
      const c=Number(a.c);
      let ms=Number(a.ms);
      if(Number.isInteger(c)&&c>=0&&c<4){
        if(!Number.isFinite(ms)||ms<0) ms=0;
        G.locked.set(p.peer,{c:c,ms:Math.min(ms,G.lim*1000),name:nm});
      }
    }
  }
  updateCount();
  if(!G.early&&ps.length&&ps.every(p=>G.locked.has(p.peer))){
    G.early=true;
    clearTimeout(G.timer);
    G.timer=setTimeout(closeQuestion,600);
  }
}
function closeQuestion(){
  if(!G||G.ph!=='q') return;
  clearTimeout(G.timer);
  stopClock();
  collect();
  const q=BANK[G.order[G.qn]];
  const dist=[0,0,0,0], done=new Set();
  for(const l of G.locked.values()){
    if(done.has(l.name)) continue;
    done.add(l.name);
    dist[l.c]++;
    const s=score(l.name);
    if(l.c===q.c){
      s.streak++;
      const base=Math.round(1000*(1-(l.ms/(q.t*1000))/2));
      s.gain=base+Math.min(s.streak-1,4)*100;
      s.res=1;
    }else{
      s.streak=0; s.gain=0; s.res=0;
    }
    s.total+=s.gain;
  }
  for(const [n,s] of G.scores){
    if(!done.has(n)){ s.streak=0; s.gain=0; s.res=-1; }
  }
  G.dist=dist; G.ok=q.c; G.ph='rev'; G.board=makeBoard();
  pubHost();
  render();
}
function endGame(){
  if(!G) return;
  stopClock();
  G.ph='end'; G.board=makeBoard();
  pubHost();
  render();
}
function playAgain(){
  if(!G||G.ph!=='end') return;
  G.gen++; G.order=makeOrder(G.want); G.total=G.order.length; G.scores=new Map(); G.qn=-1; G.ph='lobby';
  G.board=[]; G.ok=null; G.dist=[0,0,0,0]; G.locked=new Map();
  pubHost();
  render();
}
function cntText(){ return G.locked.size+' de '+players().length+' respondieron'; }
function updateCount(){
  const c=document.getElementById('cnt');
  if(c&&G) c.textContent=cntText();
}

async function joinGame(){
  if(!lobby||role) return;
  const nm=clean(inNick), p=inPin;
  if(p.length!==6){ err='Escribí el PIN de 6 dígitos.'; render(); return; }
  if(!nm){ err='Elegí un apodo para jugar.'; render(); return; }
  err='';
  try{ localStorage.setItem('di-nick',nm); }catch(e){}
  inNick=nm; pin=p; role='player';
  Pl={name:nm,av:selAv,hostSeen:false,seq:-1,skipSeq:-1,choice:null,t0:0,goneAt:0,timer:0};
  render();
  let r;
  try{ r=await lobby.join(p); }
  catch(e){ fail(e&&e.type==='peer-unavailable'?'No encontramos una partida con ese PIN.':'No se pudo conectar. Revisá tu internet y probá de nuevo.'); return; }
  if(role!=='player'||!Pl){ r.leave().catch(()=>{}); return; }
  room=r;
  r.onKick=()=>fail('Otra persona entró con tu mismo apodo.');
  bindRoom();
  Pl.timer=setTimeout(()=>{ if(Pl&&!Pl.hostSeen) fail('No encontramos una partida con ese PIN.'); },5000);
  playerSync();
  render();
}
function playerSync(){
  const H=hostPresence();
  if(!H||!Pl) return;
  if(!Pl.hostSeen){
    Pl.hostSeen=true;
    clearTimeout(Pl.timer);
    Pl.skipSeq=H.ph==='q'?H.seq:-1;
    room.presence({role:'player',name:Pl.name,av:Pl.av,a:null}).catch(()=>{});
  }
  if(H.ph==='q'){
    if(H.seq!==Pl.seq){
      Pl.seq=H.seq;
      Pl.choice=null;
      Pl.t0=performance.now();
      if(H.seq!==Pl.skipSeq) startClock(H.lim||20); else stopClock();
    }
  }else if(deadline){
    stopClock();
  }
}
function answer(i){
  const H=hostPresence();
  if(!H||!Pl||H.ph!=='q'||Pl.choice!==null||Pl.seq!==H.seq||Pl.seq===Pl.skipSeq||expired) return;
  const ms=Math.max(0,performance.now()-Pl.t0);
  Pl.choice=i;
  room.presence({a:{s:H.seq,c:i,ms:Math.round(ms)}}).catch(()=>{});
  render();
}

  return el('div',{class:'stack'},
    qhead(q,G.qn+1,G.order.length,true),
    el('div',{class:'bar'},el('i',{id:'barfill'})),
    el('h2',{class:'q',text:q.q}),
    el('div',{class:'opts'},q.o.map((_,i)=>optEl(q,i,{}))),
    el('div',{class:'actions between'},
      el('span',{id:'cnt',class:'cnt',role:'status',text:cntText()}),
      el('button',{class:'btn ghost',type:'button',onclick:closeQuestion,text:'Cerrar pregunta'})));
}
function buildHostRev(){
  const q=BANK[G.order[G.qn]];
  const r=ranks(G.board);
  const last=G.qn+1>=G.order.length;
  return el('div',{class:'stack'},
    qhead(q,G.qn+1,G.order.length,false),
    el('h2',{class:'q small',text:q.q}),
    el('div',{class:'opts'},q.o.map((_,i)=>optEl(q,i,{cls:i===q.c?'ok':'dim',count:G.dist[i],mark:i===q.c?'✓':null}))),
    q.x?el('p',{class:'note'},el('strong',{text:(q.k==='r'?'Explicación: ':'Dato: ')}),q.x):null,
    el('button',{class:'btn ghost',type:'button',disabled:bad.has(q.id),onclick:()=>{flagBad(q.id);render();},text:bad.has(q.id)?'Marcada: no volverá a salir en este dispositivo':'Reportar pregunta errónea o confusa'}),
    el('section',{class:'panel'},
      el('h3',{text:'Posiciones'}),
      boardList(G.board.slice(0,5),r.slice(0,5),null,true)),
    el('div',{class:'actions'},
      el('button',{class:'btn',type:'button',onclick:nextQuestion,text:last?'Ver podio':'Siguiente pregunta'})));
}
function buildHostEnd(){
  const b=G.board, r=ranks(b);
  return el('div',{class:'stack'},
    el('h1',{text:'Podio final'}),
    podium(b,r),
    b.length>3?el('section',{class:'panel'},boardList(b.slice(3),r.slice(3),null,false)):null,
    el('div',{class:'actions'},
      el('button',{class:'btn',type:'button',onclick:playAgain,text:'Jugar de nuevo'}),
      el('button',{class:'btn ghost',type:'button',onclick:leaveAll,text:'Cerrar partida'})));
}
function buildPLobby(){
  const names=playerNames();
  return el('div',{class:'stack'},
    el('section',{class:'panel center'},
      el('h2',{text:'¡Estás dentro, '+Pl.name+'!'}),
      el('p',{class:'lead',role:'status',text:'Esperá a que el anfitrión empiece la partida.'})),
    el('section',{class:'panel'},
      el('h3',{text:'En la sala ('+names.length+')'}),
      el('div',{class:'chips'},names.map(n=>el('span',{class:'chip',text:avOf(n)+n})))),
    el('div',{class:'actions'},el('button',{class:'btn ghost',type:'button',onclick:leaveAll,text:'Salir'})));
}
function buildPQ(){
  const H=hostPresence();
  const q=H?BANK[H.qi]:null;
  if(!q) return waitCard('Preparando la pregunta…','');
  if(Pl.seq===Pl.skipSeq) return waitCard('Entraste en medio de una pregunta','Jugás desde la próxima.');
  if(Pl.choice!==null){
    return el('div',{class:'stack'},
      waitCard('Respuesta enviada','Esperando al resto del grupo…'),
      optEl(q,Pl.choice,{}));
  }
  if(expired) return waitCard('Se acabó el tiempo','Esperá el resultado.');
  return el('div',{class:'stack'},
    qhead(q,H.qn+1,H.total,true),
    el('div',{class:'bar'},el('i',{id:'barfill'})),
    el('h2',{class:'q small',text:q.q}),
    el('div',{class:'opts'},q.o.map((_,i)=>optEl(q,i,{onclick:()=>answer(i)}))));
}
function buildPRev(){
  const H=hostPresence();
  const b=H&&Array.isArray(H.b)?H.b:[];
  const r=ranks(b);
  const i=b.findIndex(e=>e[0]===Pl.name);
  const q=H?BANK[H.qi]:null;
  if(i<0) return waitCard('Mirá la pantalla del anfitrión','Todavía no tenés puntaje en esta partida.');
  const e=b[i], res=e[3];
  let gap;
  if(r[i]===1) gap='¡Vas primero!';
  else if(b[i-1][1]-e[1]>0) gap='A '+fmt(b[i-1][1]-e[1])+' pts de '+b[i-1][0];
  else gap='Empatás con '+b[i-1][0];
  return el('div',{class:'stack'},
    el('section',{class:'result '+(res===1?'good':res===0?'bad':'none')},
      el('div',{class:'big',role:'status',text:res===1?'¡Correcto!':res===0?'Incorrecto':'No respondiste'}),
      res===1?el('div',{class:'gain',text:'+'+fmt(e[2])}):null,
      e[4]>=2?el('div',{text:'Racha de '+e[4]+' aciertos'}):null,
      res!==1&&q&&H.ok!=null?el('div',{text:'La respuesta era: '+q.o[H.ok]}):null),
    el('section',{class:'panel center'},
      el('h2',{text:'Vas '+r[i]+'.º de '+b.length+' · '+fmt(e[1])+' pts'}),
      el('p',{class:'lead',text:gap}),
      el('p',{class:'lead',text:'Esperá la próxima pregunta.'})));
}
function buildPEnd(){
  const H=hostPresence();
  const b=H&&Array.isArray(H.b)?H.b:[];
  const r=ranks(b);
  const i=b.findIndex(e=>e[0]===Pl.name);
  return el('div',{class:'stack'},
    el('section',{class:'panel center'},
      el('h1',{text:i>=0?'Terminaste '+r[i]+'.º':'Terminó la partida'}),
      i>=0?el('p',{class:'lead',text:fmt(b[i][1])+' puntos en total.'}):null),
    podium(b,r),
    el('div',{class:'actions'},el('button',{class:'btn',type:'button',onclick:leaveAll,text:'Salir'})));
}
function buildHostWait(){ return waitCard('Reconectando con el anfitrión…','Un momento.'); }
function buildHostGone(){
  return el('section',{class:'panel center'},
    el('h2',{text:'El anfitrión se desconectó'}),
    el('p',{class:'lead',text:'La partida terminó o se perdió la conexión.'}),
    el('button',{class:'btn',type:'button',onclick:leaveAll,text:'Volver al inicio'}));
}
const BUILD={
  home:buildHome, connecting:buildConnecting, hostLobby:buildHostLobby, hostQ:buildHostQ, hostRev:buildHostRev,
  hostEnd:buildHostEnd, pLobby:buildPLobby, pQ:buildPQ, pRev:buildPRev, pEnd:buildPEnd, hostWait:buildHostWait, hostGone:buildHostGone
};

/* ---------- qué pantalla toca ---------- */
function view(){
  if(!role) return {n:'home',k:[lobbyState,err,selAv,selTotal,[...selCats].join(','),seen.size,bad.size].join('|')};
  if(role==='host'){
    if(!G||!G.ready) return {n:'connecting',k:'c'};
    if(G.ph==='lobby') return {n:'hostLobby',k:playerNames().join('\u0001')+'|'+G.order.length};
    if(G.ph==='q') return {n:'hostQ',k:String(G.seq)};
    if(G.ph==='rev') return {n:'hostRev',k:G.seq+'|'+(bad.has(BANK[G.order[G.qn]].id)?1:0)};
    return {n:'hostEnd',k:String(G.gen)};
  }
  if(!Pl||!Pl.hostSeen) return {n:'connecting',k:'c'};
  const H=hostPresence();
  if(!H){
    if(!Pl.goneAt){ Pl.goneAt=Date.now(); setTimeout(render,3200); }
    return Date.now()-Pl.goneAt<3000?{n:'hostWait',k:'w'}:{n:'hostGone',k:'g'};
  }
  Pl.goneAt=0;
  if(H.ph==='lobby') return {n:'pLobby',k:playerNames().join('\u0001')};
  if(H.ph==='q') return {n:'pQ',k:[H.seq,Pl.choice,expired?1:0,Pl.seq===Pl.skipSeq?1:0].join('|')};
  if(H.ph==='rev') return {n:'pRev',k:String(H.seq)};
  return {n:'pEnd',k:String(H.gen)};
}
function render(){
  const v=view();
  const key=v.n+'#'+v.k;
  if(key===lastKey) return;
  lastKey=key;
  app.replaceChildren(BUILD[v.n]());
  window.scrollTo(0,0);
}

/* ---------- arranque ---------- */
lobby=window.Peer?Net:null;
lobbyState=lobby?'ready':'none';
render();
})();
</script>
</body>
